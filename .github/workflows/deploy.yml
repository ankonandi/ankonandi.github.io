name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.retry.outputs.page_url || steps.first.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      # A cancelled or interrupted Pages deployment can stay "in progress" and block the next one.
      # Cancel the recent ones, print what happened, and never fail the job on this step.
      - name: Clear any stuck Pages deployment
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[].sha'); do
            echo "cancel $sha"
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" || true
          done
      - name: Deploy to Pages
        id: first
        continue-on-error: true
        uses: actions/deploy-pages@v4
        with:
          timeout: 120000
      - name: Clear and retry once if the first deploy hung
        if: steps.first.outcome == 'failure'
        run: |
          for sha in $(gh api "repos/${{ github.repository }}/deployments?environment=github-pages&per_page=5" --jq '.[].sha'); do
            echo "cancel $sha"
            gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" || true
          done
          sleep 20
      - name: Deploy to Pages (retry)
        id: retry
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000
